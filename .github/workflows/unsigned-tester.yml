---
name: Unsigned Tester Installer
permissions: {}

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: Version string embedded in the tester installer.
        required: false
        type: string
        default: '2.0.0'

run-name: Unsigned Tester Installer ${{ github.ref_name }} (${{ inputs.build_version || '2.0.0' }})

jobs:
  build-windows:
    name: Build unsigned tester installer
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci-windows.yml
    with:
      release_commit: ${{ github.sha }}
      release_version: ${{ inputs.build_version || '2.0.0' }}
      release_tag: ''
      symbol_product_name: Vibepollo
      symbol_release_prefix: polo
      publish_symbols: false
      upload_symbols_artifact: false
      require_signpath_signing: false
      require_truehdr_runtime: false
